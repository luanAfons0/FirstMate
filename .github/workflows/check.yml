# The checks AGENTS.md already names, run by a machine on every change: the
# types, the lint, the layout, the dead code and the tests. Each is its own
# step, so a red run says which one failed.
#
# There is no build step, because Node 24 runs the TypeScript directly. The
# whole job runs on Linux and on Windows, because the Host runs on both: a
# Plugin Server starts from `mcp` on one and from `mcp.cmd` or `mcp.exe` on
# the other (ADR-0019). Each runner is its own required check, by name, in the
# repository's ruleset "main stays green".
#
# On Windows the tests also package the App, installer and all, and start the
# packaged program (ADR-0020). The test does that itself, as the build test
# builds the bundle, so this file names no step for it.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types, lint, layout, dead code and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One runner failing says nothing about the other, so both finish.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json, so CI runs the
      # pnpm a clone runs.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm knip

      - run: pnpm test

      # The installer of this commit, unsigned, kept so that a change to the
      # App can be installed and looked at before any tag releases it. A pull
      # request's run lists it as an artifact, FirstMate-Setup.
      - name: Package the App to try
        if: matrix.os == 'windows-latest'
        run: pnpm --filter @firstmate/desktop run package
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

      - uses: actions/upload-artifact@v7
        if: matrix.os == 'windows-latest'
        with:
          name: FirstMate-Setup
          if-no-files-found: error
          retention-days: 14
          path: apps/desktop/dist/FirstMate-Setup-*.exe
