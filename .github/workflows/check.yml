# The checks AGENTS.md already names, run by a machine on every change: the
# types, the lint, the layout, the dead code and the tests. Each is its own
# step, so a red run says which one failed.
#
# There is no build step, because Node 24 runs the TypeScript directly. The
# whole job runs on Linux and on Windows, because the Host runs on both: a
# Plugin Server starts from `mcp` on one and from `mcp.cmd` or `mcp.exe` on
# the other (ADR-0019). Each runner is its own required check, by name, in the
# repository's ruleset "main stays green".
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types, lint, layout, dead code and tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      # One runner failing says nothing about the other, so both finish.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json, so CI runs the
      # pnpm a clone runs.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm knip

      - run: pnpm test
