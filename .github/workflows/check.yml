# The checks AGENTS.md already names, run by a machine on every change: the
# types, the lint, the layout, the dead code and the tests. Each is its own
# step, so a red run says which one failed.
#
# There is no build step, because Node 24 runs the TypeScript directly. There
# is no matrix either: the Host runs in WSL Debian under systemd (ADR-0007),
# so Linux is the only platform this project has honestly run on.
name: Check

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Types, lint, layout, dead code and tests
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      # The version comes from packageManager in package.json, so CI runs the
      # pnpm a clone runs.
      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm typecheck

      - run: pnpm lint

      - run: pnpm format:check

      - run: pnpm knip

      - run: pnpm test
