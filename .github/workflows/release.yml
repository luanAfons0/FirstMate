# Release a version from a tag: the App on a GitHub Release, and the command
# line on npm, with the same number (ADR-0023).
#
# One tag does all of it, so the command line and the App never drift apart.
# The tag and the version of every package in the workspace have to agree,
# because a tag that lies is worse than no tag. The whole check runs before
# anything is published, so a broken release cannot leave the machine.
#
# The GitHub Release comes before npm. `firstmate desktop` downloads the
# installer of its own version from that Release, so a command line on npm
# must never name a Release that is not there yet.
#
# A version with a prerelease part, such as 2.0.0-beta.1, is a prerelease
# everywhere: a GitHub prerelease, and npm's `next` tag. Any other version is
# the latest on both.
#
# npm accepts GitHub Actions as a trusted publisher over OIDC: the npm job asks
# for an identity token that is minted for this one run and expires in
# minutes, so there is no NPM_TOKEN to store, leak or rotate. npm attaches a
# provenance attestation on its own, which says which workflow, which commit
# and which repository built the tarball.
name: Release

on:
  push:
    tags:
      - 'v*'

# Read-only is this repository's default. The two jobs that publish ask for
# what they need, and nothing else does.
permissions:
  contents: read

jobs:
  check:
    name: The tag, every version and the whole check
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      prerelease: ${{ steps.version.outputs.prerelease }}

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: The tag and every version must agree
        id: version
        run: |
          tag="${GITHUB_REF_NAME#v}"
          for manifest in package.json apps/*/package.json packages/*/package.json; do
            version="$(node -p "require('./$manifest').version")"
            if [ "$tag" != "$version" ]; then
              echo "The tag says $tag and $manifest says $version." >&2
              exit 1
            fi
          done
          echo "version=$tag" >> "$GITHUB_OUTPUT"
          case "$tag" in
            *-*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;;
          esac

      - run: pnpm install --frozen-lockfile

      - run: pnpm check

  # The Windows App is packaged in three passes, and a release signs between
  # them through SignPath Foundation (ADR-0027): the unpacked App, every program
  # file of it signed; the installer built from it, then signed; and the update
  # feed written last, from the signed installer's bytes, because a signature
  # changes them.
  #
  # Signing is on when the repository holds SignPath's settings: the variables
  # SIGNPATH_ORGANIZATION_ID, SIGNPATH_PROJECT_SLUG and
  # SIGNPATH_SIGNING_POLICY_SLUG, and the secret SIGNPATH_API_TOKEN. The token
  # can only ask: SignPath signs nothing until the maintainer approves the
  # request on its site, and the key never leaves SignPath's hardware. The two
  # artifact configurations SignPath reads are kept in apps/desktop/signpath/.
  # With no settings, the App ships unsigned and the run says so. Until
  # SignPath accepts FirstMate, a final version ships unsigned too, and the
  # README says what Windows shows for it (ADR-0027).
  windows:
    name: Package the App (windows)
    # No signing request goes out for a tag that fails the check.
    needs: check
    runs-on: windows-latest
    env:
      SIGNING: ${{ vars.SIGNPATH_ORGANIZATION_ID != '' && secrets.SIGNPATH_API_TOKEN != '' }}
      # Packaging signs nothing itself: SignPath does, between the passes.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
    defaults:
      run:
        shell: pwsh
        working-directory: apps/desktop

    steps:
      - name: Say when the App ships unsigned
        env:
          VERSION: ${{ needs.check.outputs.version }}
        working-directory: .
        run: |
          if ($env:SIGNING -eq 'true') { exit 0 }
          Write-Output "::warning::Signing is off, so the App of $env:VERSION ships unsigned."

      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile
        working-directory: .

      - name: Package the unpacked App
        run: pnpm run package:unpacked

      - name: Hand the unpacked App to SignPath
        id: unsigned-app
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          # Not app-*: the Release carries only what the github job downloads.
          name: unsigned-app
          if-no-files-found: error
          path: apps/desktop/dist/win-unpacked

      - name: Sign every program file of the App
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: app
          github-artifact-id: ${{ steps.unsigned-app.outputs.artifact-id }}
          # Long enough for the maintainer to approve the request.
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/dist/signed-app

      # Every program file carries a valid signature: SignPath's, or, on the
      # two DLLs Electron ships signed already, Microsoft's. A file SignPath's
      # configuration does not name, such as a new DLL in a new Electron,
      # fails here instead of shipping unsigned. The RunAsNode fuse still
      # reads on, because every Plugin Server runs on FirstMate.exe as Node
      # (ADR-0019): a fuse is a byte after its sentinel, '1' when on, and
      # RunAsNode is the first.
      - name: Check the signed App
        if: env.SIGNING == 'true'
        run: |
          Remove-Item -Recurse -Force dist/win-unpacked
          Move-Item dist/signed-app dist/win-unpacked
          $unsigned = Get-ChildItem -Recurse dist/win-unpacked -Include *.exe, *.dll |
            Where-Object { (Get-AuthenticodeSignature $_.FullName).Status -ne 'Valid' }
          if ($unsigned) {
            Write-Error "These program files carry no valid signature: $($unsigned.Name -join ', ')."
            exit 1
          }
          $bytes = [IO.File]::ReadAllBytes("$PWD/dist/win-unpacked/FirstMate.exe")
          $text = [Text.Encoding]::Latin1.GetString($bytes)
          $sentinel = 'dL7pKGdnNz796PbbjQWNKmHXBZaB9tsX'
          $at = $text.IndexOf($sentinel, [StringComparison]::Ordinal)
          if ($at -lt 0 -or $bytes[$at + $sentinel.Length + 2] -ne 0x31) {
            Write-Error 'FirstMate.exe has its RunAsNode fuse off, so no Plugin Server could start.'
            exit 1
          }

      - name: Build the installer from the unpacked App
        run: pnpm run package:installers

      - name: Hand the installer to SignPath
        id: unsigned-installer
        if: env.SIGNING == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: unsigned-installer
          if-no-files-found: error
          path: apps/desktop/dist/FirstMate-Setup-*.exe

      - name: Sign the installer
        if: env.SIGNING == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ vars.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: installer
          github-artifact-id: ${{ steps.unsigned-installer.outputs.artifact-id }}
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: apps/desktop/dist/signed-installer

      - name: Check the signed installer
        if: env.SIGNING == 'true'
        run: |
          $installer = Get-ChildItem dist/signed-installer/FirstMate-Setup-*.exe
          if ((Get-AuthenticodeSignature $installer.FullName).Status -ne 'Valid') {
            Write-Error "$($installer.Name) carries no valid signature."
            exit 1
          }
          Move-Item -Force $installer.FullName dist/

      # Last, from the installer's final bytes: its block map, and the SHA-512
      # and size in latest.yml. Unsigned, it writes what packaging wrote.
      - name: Write the update feed
        run: pnpm run package:feed

      # The installer, the block map electron-updater downloads only the
      # changed parts of an update by, and latest.yml, the update feed.
      - uses: actions/upload-artifact@v7
        with:
          name: app-windows
          if-no-files-found: error
          path: |
            apps/desktop/dist/FirstMate-Setup-*.exe
            apps/desktop/dist/FirstMate-Setup-*.exe.blockmap
            apps/desktop/dist/latest.yml

  linux:
    name: Package the App (linux)
    # Packaging makes the packages of the system it runs on, so each system
    # packages on its own runner (ADR-0026). Linux is not signed: Smart App
    # Control does not check an AppImage or a deb (ADR-0027).
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Package the App
        run: pnpm --filter @firstmate/desktop run package

      # The AppImage, which carries its block map inside it, the deb, and
      # latest-linux.yml, the AppImage's update feed.
      - uses: actions/upload-artifact@v7
        with:
          name: app-linux
          if-no-files-found: error
          path: |
            apps/desktop/dist/FirstMate-*.AppImage
            apps/desktop/dist/firstmate_*.deb
            apps/desktop/dist/latest-linux.yml

  github:
    name: Publish the GitHub Release
    needs: [check, windows, linux]
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      # Both systems' files, in one folder, as the Release carries them.
      - uses: actions/download-artifact@v8
        with:
          pattern: app-*
          merge-multiple: true
          path: release

      # The checksums are written here, from the bytes the Release will carry,
      # in the form `sha256sum --check` reads: the hash, two spaces, the name.
      # Each installer gets one of its own.
      - name: Every file the Release carries, and each installer's checksum
        working-directory: release
        env:
          VERSION: ${{ needs.check.outputs.version }}
        run: |
          windows="FirstMate-Setup-$VERSION.exe"
          appimage="FirstMate-$VERSION.AppImage"
          # The runners are x64, which a deb calls amd64.
          deb="firstmate_${VERSION}_amd64.deb"
          for file in "$windows" "$windows.blockmap" latest.yml \
            "$appimage" "$deb" latest-linux.yml; do
            if [ ! -f "$file" ]; then
              echo "Packaging wrote no $file." >&2
              exit 1
            fi
          done
          if ! grep -q "^path: $windows\$" latest.yml; then
            echo "latest.yml does not name $windows." >&2
            exit 1
          fi
          if ! grep -q "^path: $appimage\$" latest-linux.yml; then
            echo "latest-linux.yml does not name $appimage." >&2
            exit 1
          fi
          # Each feed carries the SHA-512 and the size of the bytes this
          # Release carries, or electron-updater refuses the update. Signing
          # changes the installer's bytes, so this is what proves the feed was
          # written after the last signature (ADR-0027).
          for pair in "latest.yml $windows" "latest-linux.yml $appimage"; do
            set -- $pair
            sha512="$(openssl dgst -sha512 -binary "$2" | base64 -w0)"
            size="$(stat -c %s "$2")"
            if ! grep -qx "sha512: $sha512" "$1" || ! grep -qx "    size: $size" "$1"; then
              echo "$1 does not carry the SHA-512 and the size of $2." >&2
              exit 1
            fi
          done
          for installer in "$windows" "$appimage" "$deb"; do
            sha256sum "$installer" > "$installer.sha256"
          done
          ls -l

      # A Release made by hand for this tag before the tag was pushed keeps its
      # notes: the files are added to it, and it is published.
      - name: Publish the Release
        working-directory: release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.ref_name }}
          VERSION: ${{ needs.check.outputs.version }}
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then latest=false; else latest=true; fi
          kind=(--prerelease="$PRERELEASE" --latest="$latest")
          if gh release view "$TAG" > /dev/null 2>&1; then
            gh release upload "$TAG" ./* --clobber
            gh release edit "$TAG" --draft=false "${kind[@]}"
          else
            gh release create "$TAG" ./* --verify-tag --generate-notes \
              --title "FirstMate $VERSION" "${kind[@]}"
          fi

  npm:
    name: Publish to npm
    needs: [check, github]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # Trusted publishing wants npm 11.5.1 or newer. Node 24 ships a newer one
      # already; this keeps a release from resting on that staying true.
      - run: npm install --global npm@latest

      # pnpm packs, because the package is apps/cli and its manifest names
      # workspace packages that only pnpm rewrites to versions. Packing runs
      # prepack, which builds the bundle. npm then publishes that one tarball,
      # because trusted publishing is npm's own.
      - name: Pack the command line
        working-directory: apps/cli
        run: pnpm pack --pack-destination "$RUNNER_TEMP/package"

      # No NODE_AUTH_TOKEN. npm sees the identity token, mints its own for this
      # run, and generates the provenance without being asked. A prerelease
      # goes to `next`, so that `npx @luan-afonso/firstmate` stays on the
      # latest stable version.
      - name: Publish the command line
        env:
          PRERELEASE: ${{ needs.check.outputs.prerelease }}
        run: |
          if [ "$PRERELEASE" = true ]; then tag=next; else tag=latest; fi
          npm publish "$RUNNER_TEMP"/package/*.tgz --access public --tag "$tag"
