# How the App is packaged: one program, with an installer for Windows and an
# AppImage and a deb for Linux (ADR-0020, ADR-0026). Packaging makes the
# packages of the system it runs on.
#
# The Windows installer is NSIS, one click, for this user alone: it writes
# under %LOCALAPPDATA%\Programs and asks for no administrator. The betas ship
# unsigned; the certificate is decided before 2.0.0 final.
appId: io.github.luanafons0.firstmate
productName: FirstMate
# The packed package.json is named FirstMate, not @firstmate/desktop. A per-user
# installer names the App's folder after the package, so the App lives in
# %LOCALAPPDATA%\Programs\FirstMate, and Electron calls itself FirstMate too.
# An update keeps the folder it finds in the registry, so only a fresh install
# moves to the new name.
extraMetadata:
  name: FirstMate
directories:
  output: dist
  buildResources: build
# The bundle electron-vite wrote is the whole App. The Host is inside it, and
# the App has no dependency of its own to carry beside it. The marks the Tray
# and the window wear travel beside it, in resources/icons.
files:
  - out/**
  - resources/**
  - package.json
# Only the en-US Chromium locale ships, so the installer and each update are smaller.
electronLanguages:
  - en-US
npmRebuild: false
# A Plugin Server runs on the App's own executable, told to be Node by
# ELECTRON_RUN_AS_NODE. The RunAsNode fuse is what lets it, so it is named
# here, on, so that nobody turns it off as hardening without reading why.
electronFuses:
  runAsNode: true
win:
  target: nsis
  icon: build/icon.ico
nsis:
  oneClick: true
  perMachine: false
  # Never turn deleteAppDataOnUninstall on. The data folder it deletes is
  # %APPDATA%\FirstMate, the Host's home: the Registry, the settings and every
  # Grant, which outlive the App on purpose.
  # The name `firstmate desktop` downloads the installer by, beside the
  # checksum the release workflow writes for it (ADR-0023).
  artifactName: FirstMate-Setup-${version}.${ext}
  # The name of the App's registry keys, where the installer records its
  # version and its folder for Windows, and where `firstmate desktop` reads
  # them. It is what electron-builder derives from appId, written down so that
  # nothing moves it unseen: a new GUID is a second App beside the first.
  guid: 97530065-71e0-5fdb-bf30-b8a47e68e176
# On Linux the App is an AppImage, which electron-updater keeps up to date,
# and a deb, which the package manager does (ADR-0026). Both take their mark
# from one large PNG, which the desktop scales to the size it draws.
linux:
  target:
    - AppImage
    - deb
  icon: build/icon.png
  category: Utility
  # The program, and the deb's package, are named in lower case, as Linux
  # names a command.
  executableName: firstmate
  # The desktop entry is named after desktopName in package.json, which is
  # the app ID Electron gives its window under Wayland, so the desktop links
  # the window to the entry and shows the FirstMate mark on it.
  syncDesktopName: true
  synopsis: A local plugin host.
  # A deb names its maintainer. No address is published for the project, so
  # the name stands alone, and the homepage in package.json says where to ask.
  maintainer: Luan Afonso
appImage:
  artifactName: FirstMate-${version}.${ext}
# The deb's own install script, electron-builder's, makes chrome-sandbox the
# setuid helper and gives the App an AppArmor profile, so the Chromium sandbox
# runs on Ubuntu 24.04 too (ADR-0026).
deb:
  packageName: firstmate
  artifactName: firstmate_${version}_${arch}.${ext}
# Where a release is published, so that packaging writes the update feed,
# latest.yml, and the App learns where to look for an update. Packaging
# publishes nothing itself: the release workflow attaches the files to the
# GitHub Release of the tag (ADR-0023).
publish:
  provider: github
  owner: luanAfons0
  repo: FirstMate
# Every version writes latest.yml, a beta too. Left to guess, a beta would
# write beta.yml alone. An App finds its channel from its own version: a
# stable App follows the latest stable Release, and a beta follows the newest
# Release of either kind (ADR-0023).
detectUpdateChannel: false
